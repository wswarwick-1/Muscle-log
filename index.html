<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Training Log</title>

<style>

body{
background:#000;
color:white;
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:#D4AF37;
}

button{
width:100%;
padding:14px;
margin:6px 0;
background:#D4AF37;
border:none;
border-radius:8px;
font-weight:bold;
font-size:16px;
}

select,input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:6px;
border:none;
font-size:16px;
}

.card{
background:#111;
padding:14px;
margin:12px 0;
border-radius:10px;
border:1px solid #D4AF37;
}

.exerciseTitle{
font-weight:bold;
font-size:18px;
color:#FFD700;
}

.pr{
color:#FFD700;
font-weight:bold;
}

.small{
font-size:13px;
color:#D4AF37;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<h1>Training Log</h1>

<button onclick="showPage('workoutPage')">Workout</button>
<button onclick="showPage('logPage')">Log</button>
<button onclick="showPage('customPage')">Custom Workouts</button>

<div id="workoutPage">

<select id="workoutSelect"></select>

<select id="exerciseSelect"></select>

<div id="previousBest" class="small"></div>

<input id="weight" placeholder="Weight (kg)">
<input id="reps" placeholder="Reps">

<button onclick="addSet()">Add Set</button>

<div id="setList"></div>

<button onclick="finishWorkout()">Finish Workout</button>

</div>

<div id="logPage" class="hidden">

<h2 style="color:#D4AF37;">Workout Log</h2>

<div id="log"></div>

</div>

<div id="customPage" class="hidden">

<h2 style="color:#D4AF37;">Create Workout</h2>

<input id="newWorkoutName" placeholder="Workout name">

<input id="newExercise" placeholder="Exercise name">

<button onclick="addCustomExercise()">Add Exercise</button>

<div id="customList"></div>

<button onclick="saveCustomWorkout()">Save Workout</button>

</div>

<script>

/* ----------- RECOVER ALL OLD LOGS ----------- */

function recoverLogs(){

let keys=[
"sessions",
"workoutSessions",
"trainingSessions",
"logSessions",
"trainingLog"
]

let recovered=[]

keys.forEach(key=>{

let data=localStorage.getItem(key)

if(data){

try{

let parsed=JSON.parse(data)

if(Array.isArray(parsed)){
recovered=recovered.concat(parsed)
}

}catch{}

}

})

return recovered

}

let sessions=recoverLogs()

let prs=JSON.parse(localStorage.getItem("prs"))||{}

let workouts=JSON.parse(localStorage.getItem("workouts"))||{

Push:["Bench Press","Incline DB Press","Overhead Press","Lateral Raise","Tricep Pushdown"],

Pull:["Deadlift","Pull Up","Barbell Row","Face Pull","Bicep Curl"],

Legs:["Squat","Leg Press","Romanian Deadlift","Leg Curl","Calf Raise"]

}

let currentSets=[]

let customExercises=[]

/* -------- SAVE -------- */

function saveData(){

localStorage.setItem("sessions",JSON.stringify(sessions))
localStorage.setItem("prs",JSON.stringify(prs))
localStorage.setItem("workouts",JSON.stringify(workouts))

}

/* -------- NAV -------- */

function showPage(page){

document.getElementById("workoutPage").classList.add("hidden")
document.getElementById("logPage").classList.add("hidden")
document.getElementById("customPage").classList.add("hidden")

document.getElementById(page).classList.remove("hidden")

if(page==="logPage") renderLog()

}

/* -------- WORKOUT LOAD -------- */

function loadWorkouts(){

let select=document.getElementById("workoutSelect")

select.innerHTML=""

Object.keys(workouts).forEach(w=>{

let o=document.createElement("option")
o.value=w
o.textContent=w

select.appendChild(o)

})

loadExercises()

}

function loadExercises(){

let workout=document.getElementById("workoutSelect").value

let exSelect=document.getElementById("exerciseSelect")

exSelect.innerHTML=""

workouts[workout].forEach(ex=>{

let o=document.createElement("option")
o.value=ex
o.textContent=ex

exSelect.appendChild(o)

})

showPreviousBest()

}

document.getElementById("workoutSelect").onchange=loadExercises
document.getElementById("exerciseSelect").onchange=showPreviousBest

/* -------- PREVIOUS BEST -------- */

function showPreviousBest(){

let ex=document.getElementById("exerciseSelect").value

let box=document.getElementById("previousBest")

if(prs[ex]){

box.innerHTML="Previous Best: "+prs[ex].weight+"kg x "+prs[ex].reps

}else{

box.innerHTML="Previous Best: none"

}

}

/* -------- ADD SET -------- */

function addSet(){

let ex=document.getElementById("exerciseSelect").value
let weight=document.getElementById("weight").value
let reps=document.getElementById("reps").value

if(!weight||!reps) return

currentSets.push({

exercise:ex,
weight:Number(weight),
reps:Number(reps)

})

document.getElementById("weight").value=""
document.getElementById("reps").value=""

renderSets()

}

/* -------- RENDER SETS -------- */

function renderSets(){

let box=document.getElementById("setList")

box.innerHTML=""

currentSets.forEach((s,i)=>{

box.innerHTML+=`

<div class="card">

Set ${i+1}<br>
${s.exercise}<br>
${s.weight}kg x ${s.reps}

</div>

`

})

}

/* -------- PR SYSTEM -------- */

function updatePR(ex,w,r){

if(!prs[ex]||w>prs[ex].weight){

prs[ex]={weight:w,reps:r}
return true

}

return false

}

/* -------- FINISH WORKOUT -------- */

function finishWorkout(){

if(currentSets.length===0) return

let workout=document.getElementById("workoutSelect").value

let session={

date:new Date().toLocaleDateString(),
workout:workout,
sets:[...currentSets]

}

sessions.unshift(session)

currentSets.forEach(s=>{
updatePR(s.exercise,s.weight,s.reps)
})

currentSets=[]

saveData()

renderSets()

alert("Workout saved")

}

/* -------- LOG -------- */

function renderLog(){

let log=document.getElementById("log")

log.innerHTML=""

sessions.forEach(s=>{

let volume=0

let html=`

<div class="card">

<b>${s.workout}</b><br>
<span class="small">${s.date}</span><br><br>

`

let grouped={}

s.sets.forEach(set=>{

if(!grouped[set.exercise]) grouped[set.exercise]=[]

grouped[set.exercise].push(set)

})

Object.keys(grouped).forEach(ex=>{

html+=`<div class="exerciseTitle">${ex}</div>`

grouped[ex].forEach(set=>{

volume+=set.weight*set.reps

let isPR=prs[ex] && prs[ex].weight===set.weight

html+=`
${set.weight}kg x ${set.reps}
${isPR ? "<span class='pr'> PR</span>" : ""}
<br>
`

})

html+="<br>"

})

html+=`<div class="small">Volume: ${volume} kg</div>`

html+="</div>"

log.innerHTML+=html

})

}

/* -------- CUSTOM WORKOUT -------- */

function addCustomExercise(){

let ex=document.getElementById("newExercise").value

if(!ex) return

customExercises.push(ex)

document.getElementById("newExercise").value=""

renderCustomExercises()

}

function renderCustomExercises(){

let box=document.getElementById("customList")

box.innerHTML=""

customExercises.forEach(e=>{

box.innerHTML+=`<div class="card">${e}</div>`

})

}

function saveCustomWorkout(){

let name=document.getElementById("newWorkoutName").value

if(!name||customExercises.length===0) return

workouts[name]=[...customExercises]

customExercises=[]

document.getElementById("customList").innerHTML=""
document.getElementById("newWorkoutName").value=""

saveData()

loadWorkouts()

alert("Workout Saved")

}

/* -------- START -------- */

loadWorkouts()

</script>

</body>
</html>
