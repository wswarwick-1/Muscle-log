<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Log</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#eee;
}

header{
  background:#000;
  padding:18px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:20px;
}

.gold{ color:#f2c94c; cursor:pointer; }

.container{ padding:20px; }

.card{
  background:#1c1c1c;
  padding:18px;
  margin-bottom:20px;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,0.5);
}

select,input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  border:1px solid #333;
  border-radius:8px;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  background:#f2c94c;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.session-title{
  font-size:18px;
  margin-top:20px;
  color:#f2c94c;
}

.exercise-title{
  margin-top:10px;
  font-weight:bold;
}

.set-line{
  background:#181818;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
}

.pr{
  background:#f2c94c;
  color:#000;
  padding:3px 6px;
  border-radius:6px;
  font-size:12px;
  margin-left:6px;
}
</style>
</head>
<body>

<header>
Training Log
<span class="gold" onclick="togglePage()">Log</span>
</header>

<div class="container" id="mainPage">

<div class="card">
<label>Workout</label>
<select id="workoutSelect"></select>
</div>

<div class="card">
<label>Exercise</label>
<select id="exerciseSelect"></select>
</div>

<div class="card">
<label>Add Set</label>
<input id="weight" type="number" placeholder="Weight (kg)">
<input id="reps" type="number" placeholder="Reps">
<button onclick="addSet()">Add Set</button>
<button onclick="finishWorkout()">Finish Workout</button>
<div id="liveSession"></div>
</div>

</div>

<div class="container" id="logPage" style="display:none"></div>

<script>

const DEFAULT_WORKOUTS={
  "Push":["Bench Press","Overhead Press","Incline DB Press","Lateral Raises","Tricep Pushdown"],
  "Pull":["Deadlift","Barbell Row","Lat Pulldown","Face Pull","Barbell Curl"],
  "Legs":["Squat","Romanian Deadlift","Leg Press","Hamstring Curl","Calf Raise"],
  "Powerlifting":["Squat","Bench Press","Deadlift"]
};

let workouts = DEFAULT_WORKOUTS;
let sessions = JSON.parse(localStorage.getItem("sessions")) || [];
let prs = JSON.parse(localStorage.getItem("prs")) || {};
let currentSession = null;

function init(){
  const workoutSelect=document.getElementById("workoutSelect");
  workoutSelect.innerHTML="";
  Object.keys(workouts).forEach(w=>{
    const opt=document.createElement("option");
    opt.value=w;
    opt.textContent=w;
    workoutSelect.appendChild(opt);
  });
  loadExercises();
}

function loadExercises(){
  const workout=document.getElementById("workoutSelect").value;
  const exerciseSelect=document.getElementById("exerciseSelect");
  exerciseSelect.innerHTML="";
  workouts[workout].forEach(ex=>{
    const opt=document.createElement("option");
    opt.value=ex;
    opt.textContent=ex;
    exerciseSelect.appendChild(opt);
  });
}

function startSession(){
  const workout=document.getElementById("workoutSelect").value;
  currentSession={
    date:new Date().toISOString().split("T")[0],
    workout,
    exercises:[]
  };
}

function addSet(){

  if(!currentSession) startSession();

  const exercise=document.getElementById("exerciseSelect").value;
  const weight=parseFloat(document.getElementById("weight").value);
  const reps=parseInt(document.getElementById("reps").value);

  if(!weight||!reps) return;

  let exerciseObj=currentSession.exercises.find(e=>e.name===exercise);

  if(!exerciseObj){
    exerciseObj={name:exercise,sets:[]};
    currentSession.exercises.push(exerciseObj);
  }

  exerciseObj.sets.push({weight,reps});

  if(!prs[exercise]||weight>prs[exercise].weight){
    prs[exercise]={weight,reps};
    localStorage.setItem("prs",JSON.stringify(prs));
  }

  document.getElementById("weight").value="";
  document.getElementById("reps").value="";

  renderLive();
}

function renderLive(){
  const container=document.getElementById("liveSession");
  container.innerHTML="";

  currentSession.exercises.forEach(ex=>{
    container.innerHTML+=`<div class="exercise-title">${ex.name}</div>`;
    ex.sets.forEach((s,i)=>{
      container.innerHTML+=`
      <div class="set-line">
      Set ${i+1}: ${s.weight}kg x ${s.reps}
      </div>`;
    });
  });
}

function finishWorkout(){
  if(!currentSession) return;

  sessions.push(currentSession);
  localStorage.setItem("sessions",JSON.stringify(sessions));

  currentSession=null;
  document.getElementById("liveSession").innerHTML="";
  alert("Workout Saved");
}

function togglePage(){
  const main=document.getElementById("mainPage");
  const log=document.getElementById("logPage");

  if(main.style.display==="none"){
    main.style.display="block";
    log.style.display="none";
  }else{
    main.style.display="none";
    log.style.display="block";
    renderLog();
  }
}

function renderLog(){
  const container=document.getElementById("logPage");
  container.innerHTML="";

  sessions.slice().reverse().forEach(session=>{
    container.innerHTML+=`
    <div class="session-title">
    ${session.workout} — ${session.date}
    </div>`;

    session.exercises.forEach(ex=>{
      container.innerHTML+=`<div class="exercise-title">${ex.name}</div>`;

      ex.sets.forEach(s=>{
        const isPR=prs[ex.name] && prs[ex.name].weight===s.weight;
        container.innerHTML+=`
        <div class="set-line">
        ${s.weight}kg x ${s.reps}
        ${isPR?'<span class="pr">PR</span>':''}
        </div>`;
      });
    });
  });
}

document.getElementById("workoutSelect").onchange=loadExercises;

init();

</script>

</body>
</html>
