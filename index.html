<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Training Log</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
color:#ff2a2a;
text-align:center;
}

select,input,button{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:6px;
font-size:16px;
}

select,input{
background:#1a1a1a;
color:white;
}

button{
background:#ff2a2a;
color:white;
font-weight:bold;
}

button:hover{
background:#ff4444;
}

.card{
background:#141414;
padding:15px;
border-radius:10px;
margin:10px 0;
border-left:4px solid #ff2a2a;
}

.exerciseRow{
display:flex;
gap:8px;
}

.exerciseRow input{
flex:1;
}

.pr{
color:#ffd700;
font-weight:bold;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
flex:1;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<h1>Training Log</h1>

<div class="tabs">
<button onclick="showPage('workoutPage')">Workout</button>
<button onclick="showPage('logPage')">Log</button>
<button onclick="showPage('customPage')">Custom</button>
</div>


<!-- WORKOUT PAGE -->

<div id="workoutPage">

<select id="workoutSelect" onchange="loadWorkout()">
<option value="">Select Workout</option>
</select>

<div id="exerciseContainer"></div>

<button onclick="addExercise()">Add Exercise</button>

</div>



<!-- LOG PAGE -->

<div id="logPage" class="hidden">

<h2>Training History</h2>

<div id="logContainer"></div>

</div>



<!-- CUSTOM PAGE -->

<div id="customPage" class="hidden">

<h2>Create Custom Workout</h2>

<input id="customName" placeholder="Workout name">

<div id="customExercises"></div>

<button onclick="addCustomExercise()">Add Exercise</button>
<button onclick="saveCustomWorkout()">Save Workout</button>

</div>



<script>

/* ---------- STORAGE ---------- */

let sessions = JSON.parse(localStorage.getItem("training_sessions") || "[]")
let customWorkouts = JSON.parse(localStorage.getItem("custom_workouts") || "[]")



/* ---------- PRESET WORKOUTS ---------- */

let presetWorkouts = {

Push:["Bench Press","Incline Bench","Shoulder Press","Lateral Raise","Tricep Pushdown"],

Pull:["Deadlift","Barbell Row","Lat Pulldown","Face Pull","Bicep Curl"],

Legs:["Squat","Leg Press","Leg Curl","Calf Raise"],

Powerlifting:["Squat","Bench Press","Deadlift"]

}



/* ---------- INIT ---------- */

function init(){

let select=document.getElementById("workoutSelect")

select.innerHTML='<option value="">Select Workout</option>'

Object.keys(presetWorkouts).forEach(w=>{
select.innerHTML+=`<option>${w}</option>`
})

customWorkouts.forEach(w=>{
select.innerHTML+=`<option>${w.name}</option>`
})

renderLog()

}

init()



/* ---------- PAGE SWITCH ---------- */

function showPage(page){

["workoutPage","logPage","customPage"].forEach(p=>{
document.getElementById(p).classList.add("hidden")
})

document.getElementById(page).classList.remove("hidden")

}



/* ---------- LOAD WORKOUT ---------- */

function loadWorkout(){

let workout=document.getElementById("workoutSelect").value

let exercises=presetWorkouts[workout]

customWorkouts.forEach(w=>{
if(w.name===workout)exercises=w.exercises
})

let container=document.getElementById("exerciseContainer")

container.innerHTML=""

if(!exercises)return

exercises.forEach(e=>addExercise(e))

}



/* ---------- ADD EXERCISE ---------- */

function addExercise(name=""){

let container=document.getElementById("exerciseContainer")

let div=document.createElement("div")
div.className="card"

div.innerHTML=`

<input class="exerciseName" value="${name}" placeholder="Exercise">

<div class="exerciseRow">
<input class="weight" placeholder="Weight">
<input class="reps" placeholder="Reps">
<button onclick="saveSet(this)">Save</button>
</div>

<div class="previous"></div>

`

container.appendChild(div)

updatePrevious(div)

}



/* ---------- SAVE SET ---------- */

function saveSet(btn){

let card=btn.closest(".card")

let exercise=card.querySelector(".exerciseName").value
let weight=parseFloat(card.querySelector(".weight").value)
let reps=parseInt(card.querySelector(".reps").value)

if(!exercise || !weight || !reps)return

let record={
exercise,
weight,
reps,
date:Date.now()
}

sessions.push(record)

localStorage.setItem("training_sessions",JSON.stringify(sessions))

card.querySelector(".weight").value=""
card.querySelector(".reps").value=""

updatePrevious(card)

renderLog()

}



/* ---------- PR CHECK ---------- */

function isPR(exercise,weight){

let best=0

sessions.forEach(s=>{
if(s.exercise===exercise && s.weight>best)best=s.weight
})

return weight>=best

}



/* ---------- PREVIOUS BEST ---------- */

function updatePrevious(card){

let exercise=card.querySelector(".exerciseName").value

let best=0

sessions.forEach(s=>{
if(s.exercise===exercise && s.weight>best)best=s.weight
})

let el=card.querySelector(".previous")

if(best>0){

el.innerHTML="Previous Best: "+best

}else{

el.innerHTML=""

}

}



/* ---------- LOG RENDER ---------- */

function renderLog(){

let container=document.getElementById("logContainer")

container.innerHTML=""

let sorted=[...sessions].sort((a,b)=>b.date-a.date)

sorted.forEach(s=>{

let pr=isPR(s.exercise,s.weight)

let div=document.createElement("div")
div.className="card"

div.innerHTML=`

<b>${s.exercise}</b><br>
${s.weight} kg x ${s.reps}
<br>
${new Date(s.date).toLocaleDateString()}
${pr?'<span class="pr">🏆 PR</span>':""}

`

container.appendChild(div)

})

}



/* ---------- CUSTOM WORKOUT ---------- */

function addCustomExercise(){

let container=document.getElementById("customExercises")

let input=document.createElement("input")
input.placeholder="Exercise"

container.appendChild(input)

}



function saveCustomWorkout(){

let name=document.getElementById("customName").value

let inputs=document.querySelectorAll("#customExercises input")

let exercises=[]

inputs.forEach(i=>{
if(i.value)exercises.push(i.value)
})

if(!name || exercises.length===0)return

customWorkouts.push({name,exercises})

localStorage.setItem("custom_workouts",JSON.stringify(customWorkouts))

alert("Workout Saved")

init()

}



</script>

</body>
</html>
