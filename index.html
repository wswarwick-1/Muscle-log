<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Log</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#eee;
}

header{
  background:#000;
  padding:18px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:20px;
}

.gold{ color:#f2c94c; cursor:pointer; }

.container{ padding:20px; }

.card{
  background:#1c1c1c;
  padding:18px;
  margin-bottom:20px;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,0.5);
}

select,input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  border:1px solid #333;
  border-radius:8px;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  background:#f2c94c;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.session-title{
  font-size:18px;
  margin-top:20px;
  color:#f2c94c;
}

.exercise-title{
  margin-top:10px;
  font-weight:bold;
}

.set-line{
  background:#181818;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
}

.pr{
  background:#f2c94c;
  color:#000;
  padding:3px 6px;
  border-radius:6px;
  font-size:12px;
  margin-left:6px;
}
</style>
</head>
<body>

<header>
Training Log
<span class="gold" onclick="togglePage()">Log</span>
</header>

<div class="container" id="mainPage">

<div class="card">
<label>Workout</label>
<select id="workoutSelect"></select>
</div>

<div class="card">
<label>Exercise</label>
<select id="exerciseSelect"></select>
</div>

<div class="card">
<label>Add Set</label>
<input id="weight" type="number" placeholder="Weight (kg
