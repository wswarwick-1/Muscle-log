<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Training Log</title>

<style>

body{
margin:0;
font-family:Roboto,Arial;
background:#0D0D0F;
color:#F1F1F1;
}

header{
padding:18px;
font-size:22px;
text-align:center;
font-weight:bold;
border-bottom:1px solid #222;
}

.container{
padding:16px;
padding-bottom:90px;
}

select,input{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#1A1A1F;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#C1121F;
color:white;
font-weight:bold;
font-size:16px;
}

.card{
background:#1A1A1F;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

.exerciseTitle{
font-size:18px;
font-weight:bold;
}

.previous{
font-size:13px;
color:#aaa;
margin-bottom:10px;
}

.setList{
margin-top:10px;
font-size:14px;
}

.pr{
color:#FCA311;
font-weight:bold;
margin-left:6px;
}

.fab{
position:fixed;
right:20px;
bottom:90px;
width:60px;
height:60px;
border-radius:50%;
background:#C1121F;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

.bottomNav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
display:flex;
border-top:1px solid #222;
}

.bottomNav button{
flex:1;
background:none;
padding:16px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>Training Log</header>

<div class="container">

<div id="workoutPage">

<select id="workoutSelect" onchange="loadWorkout()"></select>

<div id="exerciseContainer"></div>

</div>

<div id="logPage" class="hidden">

<div id="logContainer"></div>

</div>

<div id="customPage" class="hidden">

<input id="customWorkoutName" placeholder="Workout name">

<div id="customExercises"></div>

<button onclick="addCustomExercise()">Add Exercise</button>

<button onclick="saveCustomWorkout()">Save Workout</button>

</div>

</div>

<div class="fab" onclick="addExercise()">+</div>

<div class="bottomNav">
<button onclick="showPage('workoutPage')">Workout</button>
<button onclick="showPage('logPage')">Log</button>
<button onclick="showPage('customPage')">Custom</button>
</div>


<script>

let sessions = JSON.parse(localStorage.getItem("training_sessions")||"[]")
let customWorkouts = JSON.parse(localStorage.getItem("custom_workouts")||"[]")

let workouts={

Push:["Bench Press","Incline Bench","Shoulder Press"],

Pull:["Deadlift","Barbell Row","Lat Pulldown"],

Legs:["Squat","Leg Press","Leg Curl"]

}


function init(){

let select=document.getElementById("workoutSelect")

select.innerHTML=""

Object.keys(workouts).forEach(w=>{
select.innerHTML+=`<option>${w}</option>`
})

customWorkouts.forEach(w=>{
select.innerHTML+=`<option>${w.name}</option>`
})

}

init()


function showPage(page){

["workoutPage","logPage","customPage"].forEach(p=>{
document.getElementById(p).classList.add("hidden")
})

document.getElementById(page).classList.remove("hidden")

if(page==="logPage")renderLog()

}


function loadWorkout(){

let workout=document.getElementById("workoutSelect").value

let exercises=workouts[workout]

customWorkouts.forEach(w=>{
if(w.name===workout)exercises=w.exercises
})

let container=document.getElementById("exerciseContainer")

container.innerHTML=""

if(!exercises)return

exercises.forEach(e=>createExerciseCard(e))

}


function createExerciseCard(name){

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<div class="exerciseTitle">${name}</div>

<div class="previous">${previousBest(name)}</div>

<input class="weight" placeholder="Weight">

<input class="reps" placeholder="Reps">

<button onclick="addSet(this,'${name}')">Add Set</button>

<div class="setList"></div>

`

document.getElementById("exerciseContainer").appendChild(div)

}


function previousBest(ex){

let best=0

sessions.forEach(s=>{
if(s.exercise===ex && s.weight>best)best=s.weight
})

if(best===0)return "No previous record"

return "Previous Best: "+best+"kg"

}


function addSet(btn,exercise){

let card=btn.parentElement

let weight=parseFloat(card.querySelector(".weight").value)
let reps=parseInt(card.querySelector(".reps").value)

if(!weight || !reps)return

let record={
exercise,
weight,
reps,
date:Date.now()
}

sessions.push(record)

localStorage.setItem("training_sessions",JSON.stringify(sessions))

card.querySelector(".setList").innerHTML+=`${weight}kg x ${reps}<br>`

card.querySelector(".weight").value=""
card.querySelector(".reps").value=""

}


function renderLog(){

let container=document.getElementById("logContainer")

container.innerHTML=""

let sorted=[...sessions].sort((a,b)=>b.date-a.date)

sorted.forEach(s=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<b>${s.exercise}</b><br>

${s.weight}kg x ${s.reps}

<br>

${new Date(s.date).toLocaleDateString()}

`

container.appendChild(div)

})

}


function addExercise(){

let name=prompt("Exercise name")

if(name)createExerciseCard(name)

}


function addCustomExercise(){

let input=document.createElement("input")

input.placeholder="Exercise"

document.getElementById("customExercises").appendChild(input)

}


function saveCustomWorkout(){

let name=document.getElementById("customWorkoutName").value

let inputs=document.querySelectorAll("#customExercises input")

let exercises=[]

inputs.forEach(i=>{
if(i.value)exercises.push(i.value)
})

if(!name || exercises.length===0)return

customWorkouts.push({name,exercises})

localStorage.setItem("custom_workouts",JSON.stringify(customWorkouts))

alert("Workout Saved")

init()

}

</script>

</body>
</html>
