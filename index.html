<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Log</title>

<style>
<button onclick="checkData()">Check Saved Data</button>
body{
background:#121212;
color:white;
font-family:Arial;
padding:15px;
}

h1{
color:#f5c542;
}

select,input,button{
width:100%;
padding:10px;
margin:6px 0;
border-radius:6px;
border:none;
font-size:16px;
}

button{
background:#f5c542;
font-weight:bold;
}

.card{
background:#1e1e1e;
padding:15px;
margin:10px 0;
border-radius:10px;
}

.pr{
color:#00e676;
font-weight:bold;
}

#previousBest{
color:#f5c542;
margin-bottom:10px;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<h1>Training Log</h1>

<button onclick="showPage('workoutPage')">Workout</button>
<button onclick="showPage('logPage')">Log</button>
<button onclick="showPage('customPage')">Custom Workouts</button>

<!-- WORKOUT PAGE -->

<div id="workoutPage">

<select id="workoutSelect"></select>

<select id="exerciseSelect"></select>

<div id="previousBest"></div>

<input id="weight" placeholder="Weight">

<input id="reps" placeholder="Reps">

<button onclick="addSet()">Add Set</button>
<button onclick="saveSession()">Finish Workout</button>

<div id="sets"></div>

</div>

<!-- LOG PAGE -->

<div id="logPage" class="hidden">

<h2>Workout Log</h2>

<div id="log"></div>

</div>

<!-- CUSTOM WORKOUT PAGE -->

<div id="customPage" class="hidden">

<h2>Create Workout</h2>

<input id="newWorkoutName" placeholder="Workout Name">

<input id="newExercise" placeholder="Exercise Name">

<button onclick="addExercise()">Add Exercise</button>

<div id="exerciseList"></div>

<button onclick="saveCustomWorkout()">Save Workout</button>

</div>

<script>

const DEFAULT_WORKOUTS = {

Push:[
"Bench Press",
"Overhead Press",
"Incline DB Press",
"Lateral Raise",
"Tricep Pushdown"
],

Pull:[
"Deadlift",
"Pull Up",
"Barbell Row",
"Face Pull",
"Bicep Curl"
],

Legs:[
"Squat",
"Leg Press",
"Romanian Deadlift",
"Leg Curl",
"Calf Raise"
]

}

let workouts = JSON.parse(localStorage.getItem("workouts")) || DEFAULT_WORKOUTS
let sessions = JSON.parse(localStorage.getItem("sessions")) || []
let prs = JSON.parse(localStorage.getItem("prs")) || {}

let currentSets = []
let customExercises = []

function saveData(){
localStorage.setItem("workouts",JSON.stringify(workouts))
localStorage.setItem("sessions",JSON.stringify(sessions))
localStorage.setItem("prs",JSON.stringify(prs))
}

function showPage(page){

document.getElementById("workoutPage").classList.add("hidden")
document.getElementById("logPage").classList.add("hidden")
document.getElementById("customPage").classList.add("hidden")

document.getElementById(page).classList.remove("hidden")

if(page==="logPage") renderLog()

}

function loadWorkouts(){

let select=document.getElementById("workoutSelect")
select.innerHTML=""

Object.keys(workouts).forEach(w=>{

let o=document.createElement("option")
o.value=w
o.textContent=w

select.appendChild(o)

})

loadExercises()

}

function loadExercises(){

let workout=document.getElementById("workoutSelect").value
let exSelect=document.getElementById("exerciseSelect")

exSelect.innerHTML=""

workouts[workout].forEach(e=>{

let o=document.createElement("option")
o.value=e
o.textContent=e

exSelect.appendChild(o)

})

showPreviousBest()

}

document.getElementById("workoutSelect").onchange=loadExercises
document.getElementById("exerciseSelect").onchange=showPreviousBest

function showPreviousBest(){

let ex=document.getElementById("exerciseSelect").value
let box=document.getElementById("previousBest")

if(prs[ex]){

box.innerHTML="Previous Best: "+prs[ex].weight+"kg x "+prs[ex].reps

}else{

box.innerHTML="Previous Best: none"

}

}

function addSet(){

let ex=document.getElementById("exerciseSelect").value
let weight=document.getElementById("weight").value
let reps=document.getElementById("reps").value

if(!weight||!reps)return

currentSets.push({
exercise:ex,
weight:Number(weight),
reps:Number(reps)
})

document.getElementById("weight").value=""
document.getElementById("reps").value=""

renderSets()

}

function renderSets(){

let box=document.getElementById("sets")
box.innerHTML=""

currentSets.forEach((s,i)=>{

box.innerHTML+=`
<div class="card">
Set ${i+1} — ${s.exercise}<br>
${s.weight}kg x ${s.reps}
</div>
`

})

}

function updatePR(ex,weight,reps){

if(!prs[ex] || weight>prs[ex].weight){

prs[ex]={weight,reps}

return true

}

return false

}

function saveSession(){

if(currentSets.length===0)return

let workout=document.getElementById("workoutSelect").value
let date=new Date().toLocaleDateString()

let session={
date,
workout,
sets:[...currentSets]
}

sessions.unshift(session)

currentSets.forEach(s=>{
updatePR(s.exercise,s.weight,s.reps)
})

currentSets=[]

saveData()

renderSets()

alert("Workout Saved")

}

function renderLog(){

let log=document.getElementById("log")
log.innerHTML=""

sessions.forEach(s=>{

let html=`<div class="card"><b>${s.workout}</b><br>${s.date}<br><br>`

s.sets.forEach(set=>{

let pr=prs[set.exercise] &&
prs[set.exercise].weight===set.weight

html+=`${set.exercise} — ${set.weight}kg x ${set.reps} ${pr?"<span class='pr'>PR</span>":""}<br>`

})

html+="</div>"

log.innerHTML+=html

})

}

function addExercise(){

let ex=document.getElementById("newExercise").value

if(!ex)return

customExercises.push(ex)

document.getElementById("newExercise").value=""

renderCustomExercises()

}

function renderCustomExercises(){

let box=document.getElementById("exerciseList")
box.innerHTML=""

customExercises.forEach(e=>{

box.innerHTML+=`<div class="card">${e}</div>`

})

}

function saveCustomWorkout(){

let name=document.getElementById("newWorkoutName").value

if(!name || customExercises.length===0)return

workouts[name]=[...customExercises]

customExercises=[]

document.getElementById("exerciseList").innerHTML=""

document.getElementById("newWorkoutName").value=""

saveData()

loadWorkouts()

alert("Workout Saved")

}

loadWorkouts()
  function checkData(){
console.log(localStorage)
alert(localStorage.getItem("sessions"))
  }

</script>

</body>
</html>
