<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Training Log</title>

<style>
:root{
    --bg:#101112;
    --surface:#181a1c;
    --surface2:#202225;
    --surface3:#292b2e;
    --yellow:#f4c542;
    --yellow2:#ffd95a;
    --white:#f5f5f5;
    --muted:#8f9398;
    --border:#303236;
    --danger:#d94b4b;
    --green:#65d391;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:700px;
    margin:auto;
    padding-bottom:35px;
}

/* HEADER */

.header{
    padding:24px 20px 12px;
}

.brand{
    font-size:12px;
    letter-spacing:2.5px;
    color:var(--yellow);
    font-weight:800;
}

.title{
    font-size:30px;
    line-height:1.1;
    font-weight:800;
    margin-top:6px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
    margin-top:7px;
}

/* NAVIGATION */

.nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin:10px 16px 18px;
    padding:5px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:15px;
}

.nav button{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:11px 5px;
    border-radius:11px;
    font-size:13px;
    font-weight:700;
}

.nav button.active{
    background:var(--yellow);
    color:#111;
}

/* PAGES */

.page{
    padding:0 16px;
}

.hidden{
    display:none !important;
}

/* SECTION */

.section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
    font-weight:800;
    margin:20px 3px 9px;
}

/* SELECT */

.select-wrap{
    position:relative;
}

select{
    width:100%;
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--white);
    border-radius:14px;
    padding:16px 45px 16px 16px;
    outline:none;
}

.select-wrap:after{
    content:"⌄";
    position:absolute;
    right:17px;
    top:13px;
    color:var(--yellow);
    font-size:20px;
    pointer-events:none;
}

/* WORKOUT HEADER */

.workout-header{
    background:linear-gradient(
        145deg,
        #202225,
        #17191b
    );
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.workout-name{
    font-size:22px;
    font-weight:800;
}

.workout-description{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

/* EXERCISE CARD */

.exercise-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;
    box-shadow:0 8px 25px rgba(0,0,0,.16);
}

.exercise-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.exercise-name{
    font-size:18px;
    font-weight:800;
}

.change-btn{
    width:auto;
    margin:0;
    padding:7px 10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--yellow);
    font-size:11px;
    font-weight:800;
}

.previous{
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
}

.previous strong{
    color:var(--yellow);
}

/* INPUTS */

.input-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}

.input{
    width:100%;
    background:#101112;
    border:1px solid var(--border);
    color:var(--white);
    padding:14px;
    border-radius:11px;
    outline:none;
    text-align:center;
    font-size:16px;
}

.input:focus{
    border-color:var(--yellow);
}

.input-label{
    display:block;
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:center;
    margin-bottom:5px;
}

/* BUTTONS */

.primary{
    width:100%;
    border:0;
    background:var(--yellow);
    color:#111;
    padding:14px;
    border-radius:11px;
    margin-top:10px;
    font-weight:850;
    font-size:14px;
}

.primary:active{
    transform:scale(.985);
}

.secondary{
    width:100%;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--white);
    padding:13px;
    border-radius:11px;
    margin-top:9px;
    font-weight:700;
}

.danger{
    color:#ff8c8c;
    border-color:#512828;
}

/* SETS */

.sets{
    margin-top:14px;
}

.set-row{
    display:grid;
    grid-template-columns:30px 1fr auto;
    align-items:center;
    gap:8px;
    padding:9px 0;
    border-top:1px solid var(--border);
}

.set-number{
    color:var(--muted);
    font-size:12px;
}

.set-value{
    font-size:14px;
    font-weight:700;
}

.repeat{
    border:0;
    background:transparent;
    color:var(--yellow);
    font-size:11px;
    font-weight:800;
}

.pr{
    display:inline-block;
    background:var(--yellow);
    color:#111;
    padding:3px 7px;
    border-radius:6px;
    font-size:9px;
    font-weight:900;
    margin-left:5px;
}

/* ADD EXERCISE */

.add-exercise{
    border:1px dashed #56585c;
    background:transparent;
    color:var(--yellow);
    width:100%;
    padding:14px;
    border-radius:14px;
    font-weight:800;
    margin-bottom:15px;
}

/* LOG */

.log-session{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    margin-bottom:15px;
    overflow:hidden;
}

.log-header{
    padding:15px 16px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
}

.log-date{
    color:var(--yellow);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.log-workout{
    font-size:18px;
    font-weight:800;
    margin-top:4px;
}

.log-exercise{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
}

.log-exercise:last-child{
    border-bottom:0;
}

.log-exercise-name{
    font-weight:800;
    margin-bottom:7px;
}

.log-set{
    color:#d5d6d7;
    font-size:13px;
    padding:3px 0;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:45px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:32px;
    margin-bottom:10px;
}

.empty-title{
    color:var(--white);
    font-weight:800;
    margin-bottom:5px;
}

/* CUSTOM */

.custom-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:17px;
    padding:16px;
    margin-bottom:12px;
}

.text-input{
    width:100%;
    background:#101112;
    color:white;
    border:1px solid var(--border);
    border-radius:11px;
    padding:14px;
    outline:none;
}

.custom-exercise-row{
    display:flex;
    gap:8px;
    margin-top:9px;
}

.custom-exercise-row .text-input{
    flex:1;
}

.remove{
    width:44px;
    border:1px solid #4a2929;
    background:#211516;
    color:#ff8c8c;
    border-radius:10px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:100;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.modal-box{
    width:100%;
    max-width:700px;
    max-height:85vh;
    overflow:auto;
    background:#191b1d;
    border:1px solid var(--border);
    border-radius:22px 22px 0 0;
    padding:20px;
}

.modal-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:15px;
}

.exercise-choice{
    width:100%;
    text-align:left;
    background:var(--surface2);
    color:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:7px;
}

.exercise-choice:active{
    border-color:var(--yellow);
}

/* BACKUP */

.backup-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:17px;
    padding:16px;
    margin-top:15px;
}

.small{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:#f4c542;
    color:#111;
    padding:11px 16px;
    border-radius:10px;
    font-weight:800;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(min-width:650px){
    .page{
        padding:0 22px;
    }

    .header{
        padding-left:22px;
        padding-right:22px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">PERFORMANCE</div>
        <div class="title">Training Log</div>
        <div class="subtitle">Track. Progress. Get stronger.</div>
    </header>

    <nav class="nav">
        <button id="navWorkout" class="active"
                onclick="showPage('workout')">Workout</button>
        <button id="navLog"
                onclick="showPage('log')">Training Log</button>
        <button id="navManage"
                onclick="showPage('manage')">Manage</button>
    </nav>


    <!-- WORKOUT -->

    <main id="pageWorkout" class="page">

        <div class="section-title">Programme</div>

        <div class="select-wrap">
            <select id="workoutSelect"
                    onchange="selectWorkout()"></select>
        </div>

        <div id="workoutHeader"></div>

        <div id="exerciseContainer"></div>

        <button class="add-exercise"
                onclick="openExercisePicker()">
            + Add / Change Exercise
        </button>

        <button class="primary"
                onclick="finishWorkout()">
            FINISH WORKOUT
        </button>

    </main>


    <!-- LOG -->

    <main id="pageLog" class="page hidden">

        <div class="section-title">Training History</div>

        <div id="logContainer"></div>

        <div class="backup-card">

            <div style="font-weight:800;margin-bottom:5px;">
                Data Protection
            </div>

            <div class="small">
                Keep a backup of your training history so it can
                be restored if the app is reinstalled.
            </div>

            <button class="secondary"
                    onclick="exportBackup()">
                Export Training Backup
            </button>

            <label class="secondary"
                   style="display:block;text-align:center;cursor:pointer;">
                Import Training Backup
                <input id="importFile"
                       type="file"
                       accept=".json"
                       style="display:none"
                       onchange="importBackup(event)">
            </label>

        </div>

    </main>


    <!-- MANAGE -->

    <main id="pageManage" class="page hidden">

        <div class="section-title">Your Workouts</div>

        <div id="workoutList"></div>

        <div class="section-title">Create Custom Workout</div>

        <div class="custom-card">

            <input id="customWorkoutName"
                   class="text-input"
                   placeholder="Workout name">

            <div id="customExerciseInputs"></div>

            <button class="secondary"
                    onclick="addCustomExerciseInput()">
                + Add Exercise
            </button>

            <button class="primary"
                    onclick="saveCustomWorkout()">
                SAVE CUSTOM WORKOUT
            </button>

        </div>

    </main>

</div>


<!-- EXERCISE PICKER -->

<div id="exerciseModal"
     class="modal hidden"
     onclick="closeModal(event)">

    <div class="modal-box"
         onclick="event.stopPropagation()">

        <div class="modal-title">
            Choose Exercise
        </div>

        <input id="exerciseSearch"
               class="text-input"
               placeholder="Search exercises..."
               oninput="filterExercises()">

        <div id="exerciseChoices"
             style="margin-top:12px;"></div>

        <button class="secondary"
                onclick="closeExercisePicker()">
            Cancel
        </button>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   STORAGE
   ========================================================= */

const APP_KEY = "training_log_v2";

const OLD_KEYS = [
    "training_sessions",
    "sessions",
    "workoutSessions",
    "trainingSessions",
    "logSessions",
    "trainingLog",
    "workoutLog",
    "workoutHistory",
    "trainingHistory",
    "log"
];


/* =========================================================
   NEW PROGRAMMES
   ========================================================= */

const PROGRAMMES = {

    "Upper A — Chest Focus":{
        description:"Upper body strength with chest priority.",
        exercises:[
            "Barbell Bench Press",
            "Incline Dumbbell Press",
            "Chest-Supported Row",
            "Seated Shoulder Press",
            "Cable Lateral Raise",
            "Triceps Pressdown",
            "Dumbbell Curl"
        ]
    },

    "Lower A — Quad Focus":{
        description:"Quad-dominant lower body session.",
        exercises:[
            "Back Squat",
            "Leg Press",
            "Bulgarian Split Squat",
            "Leg Extension",
            "Romanian Deadlift",
            "Seated Leg Curl",
            "Standing Calf Raise"
        ]
    },

    "Upper B — Arms Focus":{
        description:"Arm-focused upper body session.",
        exercises:[
            "Close-Grip Bench Press",
            "EZ-Bar Curl",
            "Incline Dumbbell Curl",
            "Overhead Cable Triceps Extension",
            "Hammer Curl",
            "Cable Triceps Pressdown",
            "Cable Lateral Raise",
            "Chest-Supported Row"
        ]
    },

    "Lower B — Calf Focus":{
        description:"Lower body session with dedicated calf volume.",
        exercises:[
            "Romanian Deadlift",
            "Hack Squat",
            "Lying Leg Curl",
            "Leg Extension",
            "Standing Calf Raise",
            "Seated Calf Raise",
            "Single-Leg Calf Raise"
        ]
    }

};


/* =========================================================
   EXERCISE LIBRARY
   ========================================================= */

const EXERCISE_LIBRARY = [

    "Back Squat",
    "Front Squat",
    "Hack Squat",
    "Leg Press",
    "Leg Extension",
    "Bulgarian Split Squat",
    "Romanian Deadlift",
    "Conventional Deadlift",
    "Lying Leg Curl",
    "Seated Leg Curl",
    "Standing Calf Raise",
    "Seated Calf Raise",
    "Single-Leg Calf Raise",

    "Barbell Bench Press",
    "Close-Grip Bench Press",
    "Incline Barbell Press",
    "Incline Dumbbell Press",
    "Dumbbell Bench Press",
    "Chest-Supported Row",
    "Barbell Row",
    "Cable Row",
    "Lat Pulldown",
    "Pull-Up",
    "Seated Shoulder Press",
    "Dumbbell Shoulder Press",
    "Cable Lateral Raise",
    "Dumbbell Lateral Raise",
    "Face Pull",

    "EZ-Bar Curl",
    "Dumbbell Curl",
    "Incline Dumbbell Curl",
    "Hammer Curl",
    "Cable Curl",
    "Triceps Pressdown",
    "Cable Triceps Pressdown",
    "Overhead Cable Triceps Extension",
    "Skull Crusher"

];


/* =========================================================
   STATE
   ========================================================= */

let data = {
    sessions:[],
    customWorkouts:[]
};

let currentWorkout = null;
let currentExercises = [];
let currentSets = {};
let exerciseBeingChanged = null;
let customExerciseInputs = [];


/* =========================================================
   HELPERS
   ========================================================= */

function safeParse(value){

    if(!value) return null;

    try{
        return JSON.parse(value);
    }catch{
        return null;
    }
}


function normaliseSet(set){

    if(!set) return null;

    const exercise =
        set.exercise ||
        set.name ||
        set.exerciseName;

    const weight =
        Number(
            set.weight ??
            set.kg ??
            set.load ??
            0
        );

    const reps =
        Number(
            set.reps ??
            set.rep ??
            0
        );

    if(!exercise || !weight || !reps){
        return null;
    }

    return {
        exercise:String(exercise),
        weight,
        reps,
        timestamp:Number(
            set.timestamp ??
            set.date ??
            Date.now()
        ),
        pr:!!set.pr
    };
}


/* =========================================================
   RECOVERY ENGINE
   ========================================================= */

function recoverOldSessions(){

    const recovered = [];

    OLD_KEYS.forEach(key=>{

        const parsed = safeParse(
            localStorage.getItem(key)
        );

        if(!parsed) return;

        let possible = [];

        if(Array.isArray(parsed)){
            possible = parsed;
        }
        else if(Array.isArray(parsed.sessions)){
            possible = parsed.sessions;
        }
        else if(Array.isArray(parsed.history)){
            possible = parsed.history;
        }

        possible.forEach(item=>{

            /*
             Old app versions stored individual sets.
            */

            if(
                item.exercise ||
                item.exerciseName
            ){

                const set = normaliseSet(item);

                if(set){
                    recovered.push({
                        id:"recovered-"+set.timestamp+
                           "-"+Math.random(),
                        workout:item.workout ||
                                item.workoutName ||
                                "Recovered Workout",
                        date:set.timestamp,
                        sets:[set],
                        recovered:true
                    });
                }

                return;
            }


            /*
             Old app versions stored complete sessions.
            */

            if(Array.isArray(item.sets)){

                const sets = item.sets
                    .map(normaliseSet)
                    .filter(Boolean);

                if(sets.length){

                    recovered.push({
                        id:item.id ||
                            "recovered-"+Date.now()+
                            "-"+Math.random(),
                        workout:item.workout ||
                                item.workoutName ||
                                "Recovered Workout",
                        date:Number(
                            item.date ||
                            item.timestamp ||
                            Date.now()
                        ),
                        sets,
                        recovered:true
                    });

                }

            }

        });

    });

    return recovered;
}


/* =========================================================
   LOAD DATA
   ========================================================= */

function loadData(){

    const saved = safeParse(
        localStorage.getItem(APP_KEY)
    );

    if(saved && typeof saved==="object"){

        data.sessions =
            Array.isArray(saved.sessions)
            ? saved.sessions
            : [];

        data.customWorkouts =
            Array.isArray(saved.customWorkouts)
            ? saved.customWorkouts
            : [];

    }

    /*
       Recover old data WITHOUT deleting it.
    */

    const recovered = recoverOldSessions();

    const existingSignatures =
        new Set(
            data.sessions.map(sessionSignature)
        );

    recovered.forEach(session=>{

        const sig=sessionSignature(session);

        if(!existingSignatures.has(sig)){

            data.sessions.push(session);
            existingSignatures.add(sig);

        }

    });

    saveData();
}


function sessionSignature(session){

    const sets=(session.sets||[])
        .map(s=>
            `${s.exercise}|${s.weight}|${s.reps}|${s.timestamp}`
        )
        .join(";");

    return `${session.workout}|${session.date}|${sets}`;
}


function saveData(){

    localStorage.setItem(
        APP_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   INIT
   ========================================================= */

function init(){

    loadData();

    populateWorkoutSelect();

    renderWorkoutList();

    selectWorkout();

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function showPage(page){

    document
        .getElementById("pageWorkout")
        .classList.add("hidden");

    document
        .getElementById("pageLog")
        .classList.add("hidden");

    document
        .getElementById("pageManage")
        .classList.add("hidden");

    document
        .getElementById("navWorkout")
        .classList.remove("active");

    document
        .getElementById("navLog")
        .classList.remove("active");

    document
        .getElementById("navManage")
        .classList.remove("active");


    if(page==="workout"){

        document
            .getElementById("pageWorkout")
            .classList.remove("hidden");

        document
            .getElementById("navWorkout")
            .classList.add("active");

    }


    if(page==="log"){

        document
            .getElementById("pageLog")
            .classList.remove("hidden");

        document
            .getElementById("navLog")
            .classList.add("active");

        renderLog();

    }


    if(page==="manage"){

        document
            .getElementById("pageManage")
            .classList.remove("hidden");

        document
            .getElementById("navManage")
            .classList.add("active");

        renderWorkoutList();

    }

}


/* =========================================================
   WORKOUT SELECT
   ========================================================= */

function populateWorkoutSelect(){

    const select =
        document.getElementById("workoutSelect");

    select.innerHTML="";

    Object.keys(PROGRAMMES).forEach(name=>{

        const option=document.createElement("option");

        option.value=name;
        option.textContent=name;

        select.appendChild(option);

    });


    data.customWorkouts.forEach(workout=>{

        const option=document.createElement("option");

        option.value="custom:"+workout.id;
        option.textContent=workout.name;

        select.appendChild(option);

    });

}


/* =========================================================
   SELECT WORKOUT
   ========================================================= */

function selectWorkout(){

    const value =
        document.getElementById("workoutSelect").value;

    if(value.startsWith("custom:")){

        const id=value.replace("custom:","");

        currentWorkout =
            data.customWorkouts.find(w=>w.id===id);

        currentExercises =
            currentWorkout
            ? [...currentWorkout.exercises]
            : [];

    }else{

        currentWorkout = {
            name:value,
            description:PROGRAMMES[value].description
        };

        currentExercises =
            [...PROGRAMMES[value].exercises];

    }

    currentSets={};

    currentExercises.forEach(ex=>{
        currentSets[ex]=[];
    });

    renderWorkout();

}


/* =========================================================
   WORKOUT HEADER
   ========================================================= */

function renderWorkout(){

    const header =
        document.getElementById("workoutHeader");

    const name =
        currentWorkout?.name || "";

    const description =
        currentWorkout?.description || "";

    header.innerHTML=`

        <div class="workout-header">

            <div class="workout-name">
                ${escapeHTML(name)}
            </div>

            <div class="workout-description">
                ${escapeHTML(description)}
            </div>

        </div>

    `;


    const container =
        document.getElementById("exerciseContainer");

    container.innerHTML="";

    currentExercises.forEach(ex=>{
        renderExerciseCard(ex);
    });

}


/* =========================================================
   PREVIOUS BEST
   ========================================================= */

function getPreviousBest(exercise){

    let best=null;

    data.sessions.forEach(session=>{

        (session.sets||[]).forEach(set=>{

            if(
                set.exercise===exercise &&
                Number(set.weight)>0
            ){

                if(
                    !best ||
                    Number(set.weight)>best.weight ||
                    (
                        Number(set.weight)===best.weight &&
                        Number(set.reps)>best.reps
                    )
                ){

                    best={
                        weight:Number(set.weight),
                        reps:Number(set.reps)
                    };

                }

            }

        });

    });

    return best;
}


/* =========================================================
   EXERCISE CARD
   ========================================================= */

function renderExerciseCard(exercise){

    const container =
        document.getElementById("exerciseContainer");

    const card =
        document.createElement("div");

    card.className="exercise-card";

    const previous =
        getPreviousBest(exercise);

    let previousHTML =
        "No previous record";

    if(previous){

        previousHTML =
            `Previous best • <strong>
                ${previous.weight}kg × ${previous.reps}
             </strong>`;

    }

    card.innerHTML=`

        <div class="exercise-top">

            <div>

                <div class="exercise-name">
                    ${escapeHTML(exercise)}
                </div>

                <div class="previous">
                    ${previousHTML}
                </div>

            </div>

            <button class="change-btn"
                    onclick="openExercisePicker('${escapeJS(exercise)}')">
                CHANGE
            </button>

        </div>

        <div class="input-row">

            <div>
                <span class="input-label">Weight KG</span>
                <input class="input weight-input"
                       inputmode="decimal"
                       placeholder="0">
            </div>

            <div>
                <span class="input-label">Reps</span>
                <input class="input reps-input"
                       inputmode="numeric"
                       placeholder="0">
            </div>

        </div>

        <button class="primary"
                onclick="addSetToExercise(this,'${escapeJS(exercise)}')">
            ADD SET
        </button>

        <div class="sets"></div>

    `;

    container.appendChild(card);

    renderExistingSets(card,exercise);

}


/* =========================================================
   ADD SET
   ========================================================= */

function addSetToExercise(button,exercise){

    const card=button.closest(".exercise-card");

    const weight=
        Number(
            card.querySelector(".weight-input").value
        );

    const reps=
        Number(
            card.querySelector(".reps-input").value
        );

    if(!weight || !reps){

        showToast("Enter weight and reps");

        return;
    }


    if(!currentSets[exercise]){
        currentSets[exercise]=[];
    }


    const pr=isNewPR(exercise,weight,reps);

    const set={

        exercise,
        weight,
        reps,
        timestamp:Date.now(),
        pr

    };


    currentSets[exercise].push(set);

    renderExistingSets(card,exercise);


    card.querySelector(".weight-input").value="";
    card.querySelector(".reps-input").value="";


    if(pr){

        showToast("New PR!");

    }

}


/* =========================================================
   NEW PR
   ========================================================= */

function isNewPR(exercise,weight,reps){

    const previous =
        getPreviousBest(exercise);

    if(!previous){
        return true;
    }

    return (
        weight>previous.weight ||
        (
            weight===previous.weight &&
            reps>previous.reps
        )
    );

}


/* =========================================================
   SET DISPLAY
   ========================================================= */

function renderExistingSets(card,exercise){

    const setsContainer =
        card.querySelector(".sets");

    const sets =
        currentSets[exercise] || [];

    setsContainer.innerHTML="";

    sets.forEach((set,index)=>{

        const row =
            document.createElement("div");

        row.className="set-row";

        row.innerHTML=`

            <div class="set-number">
                ${index+1}
            </div>

            <div class="set-value">
                ${set.weight}kg × ${set.reps}

                ${
                    set.pr
                    ? `<span class="pr">PR</span>`
                    : ""
                }

            </div>

            <button class="repeat"
                    onclick="repeatSet('${escapeJS(exercise)}',${set.weight},${set.reps})">
                REPEAT
            </button>

        `;

        setsContainer.appendChild(row);

    });

}


/* =========================================================
   REPEAT SET
   ========================================================= */

function repeatSet(exercise,weight,reps){

    const cards =
        document.querySelectorAll(".exercise-card");

    cards.forEach(card=>{

        const title =
            card.querySelector(".exercise-name");

        if(title && title.textContent.trim()===exercise){

            card.querySelector(".weight-input").value=weight;
            card.querySelector(".reps-input").value=reps;

            card
                .querySelector(".weight-input")
                .focus();

        }

    });

}


/* =========================================================
   FINISH WORKOUT
   ========================================================= */

function finishWorkout(){

    const allSets =
        Object.values(currentSets)
            .flat();

    if(!allSets.length){

        showToast("Add at least one set");

        return;
    }


    const session={

        id:"session-"+Date.now(),

        workout:currentWorkout.name,

        date:Date.now(),

        sets:allSets.map(s=>({...s}))

    };


    data.sessions.unshift(session);

    saveData();


    showToast("Workout saved");

    currentSets={};

    currentExercises.forEach(ex=>{
        currentSets[ex]=[];
    });

    renderWorkout();

}


/* =========================================================
   CHANGE EXERCISE
   ========================================================= */

function openExercisePicker(exercise=null){

    exerciseBeingChanged=exercise;

    const modal =
        document.getElementById("exerciseModal");

    modal.classList.remove("hidden");

    document.getElementById("exerciseSearch").value="";

    renderExerciseChoices();

}


function renderExerciseChoices(){

    const box =
        document.getElementById("exerciseChoices");

    const search =
        document.getElementById("exerciseSearch")
            .value
            .toLowerCase()
            .trim();

    box.innerHTML="";

    EXERCISE_LIBRARY
        .filter(ex=>
            !search ||
            ex.toLowerCase().includes(search)
        )
        .forEach(ex=>{

            const button =
                document.createElement("button");

            button.className="exercise-choice";

            button.textContent=ex;

            button.onclick=()=>{
                chooseExercise(ex);
            };

            box.appendChild(button);

        });

}


function filterExercises(){
    renderExerciseChoices();
}


function chooseExercise(exercise){

    if(exerciseBeingChanged){

        const old=exerciseBeingChanged;

        const index =
            currentExercises.indexOf(old);

        if(index!==-1){

            currentExercises[index]=exercise;

            currentSets[exercise]=
                currentSets[exercise] || [];

            delete currentSets[old];

        }

    }else{

        if(!currentExercises.includes(exercise)){

            currentExercises.push(exercise);
            currentSets[exercise]=[];

        }

    }

    closeExercisePicker();

    renderWorkout();

}


function closeExercisePicker(){

    document
        .getElementById("exerciseModal")
        .classList.add("hidden");

    exerciseBeingChanged=null;

}


function closeModal(event){

    if(event.target.id==="exerciseModal"){
        closeExercisePicker();
    }

}


/* =========================================================
   LOG
   ========================================================= */

function renderLog(){

    const container =
        document.getElementById("logContainer");

    container.innerHTML="";

    if(!data.sessions.length){

        container.innerHTML=`

            <div class="empty">

                <div class="empty-icon">◎</div>

                <div class="empty-title">
                    No training sessions yet
                </div>

                <div>
                    Complete your first workout
                    and it will appear here.
                </div>

            </div>

        `;

        return;
    }


    const sessions =
        [...data.sessions]
            .sort((a,b)=>b.date-a.date);


    sessions.forEach(session=>{

        const card =
            document.createElement("div");

        card.className="log-session";


        const date =
            formatDate(session.date);


        const grouped={};

        (session.sets||[]).forEach(set=>{

            if(!grouped[set.exercise]){
                grouped[set.exercise]=[];
            }

            grouped[set.exercise].push(set);

        });


        let html=`

            <div class="log-header">

                <div class="log-date">
                    ${date}
                </div>

                <div class="log-workout">
                    ${escapeHTML(
                        session.workout ||
                        "Workout"
                    )}
                </div>

            </div>

        `;


        Object.keys(grouped).forEach(exercise=>{

            html+=`

                <div class="log-exercise">

                    <div class="log-exercise-name">
                        ${escapeHTML(exercise)}
                    </div>

            `;


            grouped[exercise].forEach(set=>{

                html+=`

                    <div class="log-set">

                        ${set.weight}kg × ${set.reps}

                        ${
                            set.pr
                            ? `<span class="pr">PR</span>`
                            : ""
                        }

                    </div>

                `;

            });


            html+=`</div>`;

        });


        card.innerHTML=html;

        container.appendChild(card);

    });

}


/* =========================================================
   CUSTOM WORKOUTS
   ========================================================= */

function addCustomExerciseInput(value=""){

    const container =
        document.getElementById(
            "customExerciseInputs"
        );

    const row =
        document.createElement("div");

    row.className="custom-exercise-row";

    row.innerHTML=`

        <input class="text-input"
               value="${escapeHTML(value)}"
               placeholder="Exercise">

        <button class="remove"
                onclick="this.parentElement.remove()">
            ×
        </button>

    `;

    container.appendChild(row);

}


function saveCustomWorkout(){

    const name =
        document.getElementById(
            "customWorkoutName"
        ).value.trim();

    const inputs =
        document.querySelectorAll(
            "#customExerciseInputs .text-input"
        );

    const exercises =
        [...inputs]
            .map(input=>input.value.trim())
            .filter(Boolean);


    if(!name){

        showToast("Enter a workout name");

        return;
    }

    if(!exercises.length){

        showToast("Add at least one exercise");

        return;
    }


    const workout={

        id:"custom-"+Date.now(),

        name,

        description:"Custom workout",

        exercises

    };


    data.customWorkouts.push(workout);

    saveData();

    document.getElementById(
        "customWorkoutName"
    ).value="";

    document.getElementById(
        "customExerciseInputs"
    ).innerHTML="";


    populateWorkoutSelect();

    renderWorkoutList();

    showToast("Custom workout saved");

}


/* =========================================================
   MANAGE WORKOUTS
   ========================================================= */

function renderWorkoutList(){

    const container =
        document.getElementById("workoutList");

    container.innerHTML="";


    Object.keys(PROGRAMMES).forEach(name=>{

        const p=PROGRAMMES[name];

        const card =
            document.createElement("div");

        card.className="custom-card";

        card.innerHTML=`

            <div style="font-size:17px;font-weight:800;">
                ${escapeHTML(name)}
            </div>

            <div class="small"
                 style="margin-top:5px;">
                ${p.exercises.length} exercises
            </div>

            <div class="small"
                 style="margin-top:7px;">
                ${p.exercises
                    .map(escapeHTML)
                    .join(" • ")}
            </div>

        `;

        container.appendChild(card);

    });


    data.customWorkouts.forEach(workout=>{

        const card =
            document.createElement("div");

        card.className="custom-card";

        card.innerHTML=`

            <div style="
                display:flex;
                justify-content:space-between;
                gap:10px;
                align-items:center;
            ">

                <div>

                    <div style="
                        font-size:17px;
                        font-weight:800;
                    ">
                        ${escapeHTML(workout.name)}
                    </div>

                    <div class="small"
                         style="margin-top:4px;">
                        Custom •
                        ${workout.exercises.length}
                        exercises
                    </div>

                </div>

                <button class="change-btn"
                        onclick="deleteCustomWorkout('${escapeJS(workout.id)}')">
                    DELETE
                </button>

            </div>

        `;

        container.appendChild(card);

    });

}


function deleteCustomWorkout(id){

    if(!confirm("Delete this custom workout?")){
        return;
    }

    data.customWorkouts =
        data.customWorkouts.filter(
            w=>w.id!==id
        );

    saveData();

    populateWorkoutSelect();

    renderWorkoutList();

    selectWorkout();

}


/* =========================================================
   BACKUP
   ========================================================= */

function exportBackup(){

    const backup={

        app:"Training Log",

        version:2,

        exported:new Date().toISOString(),

        data

    };


    const blob =
        new Blob(
            [JSON.stringify(backup,null,2)],
            {type:"application/json"}
        );


    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href=url;

    a.download=
        "training-log-backup-" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    showToast("Backup exported");

}


function importBackup(event){

    const file =
        event.target.files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload=function(){

        try{

            const backup =
                JSON.parse(reader.result);


            if(
                !backup.data ||
                !Array.isArray(
                    backup.data.sessions
                )
            ){

                throw new Error();

            }


            /*
               Merge rather than replace.
            */

            const existing =
                new Set(
                    data.sessions.map(
                        sessionSignature
                    )
                );


            backup.data.sessions.forEach(session=>{

                const sig=
                    sessionSignature(session);

                if(!existing.has(sig)){

                    data.sessions.push(session);

                    existing.add(sig);

                }

            });


            if(
                Array.isArray(
                    backup.data.customWorkouts
                )
            ){

                const existingCustom=
                    new Set(
                        data.customWorkouts
                            .map(w=>w.id)
                    );

                backup.data.customWorkouts
                    .forEach(workout=>{

                        if(
                            !existingCustom.has(
                                workout.id
                            )
                        ){

                            data.customWorkouts.push(
                                workout
                            );

                        }

                    });

            }


            saveData();

            populateWorkoutSelect();

            renderLog();

            renderWorkoutList();

            showToast("Backup restored");

        }catch{

            alert(
                "That file could not be restored."
            );

        }

    };


    reader.readAsText(file);

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(timestamp){

    const date=new Date(timestamp);

    return date.toLocaleDateString(
        undefined,
        {
            weekday:"short",
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   SECURITY / TEXT
   ========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent=message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{

        toast.classList.remove("show");

    },1800);

}


/* =========================================================
   START
   ========================================================= */

init();

</script>
