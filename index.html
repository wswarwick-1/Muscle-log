<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Training Log</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Arial;
background:#0f0f10;
color:white;
}

header{
text-align:center;
padding:18px;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #222;
}

.container{
padding:16px;
padding-bottom:90px;
}

select,input{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:none;
background:#1c1c1e;
color:white;
font-size:16px;
}

button{
width:100%;
padding:16px;
margin:8px 0;
border-radius:12px;
border:none;
background:#b11226;
color:white;
font-size:16px;
font-weight:bold;
}

button:active{
transform:scale(.98);
}

.card{
background:#1c1c1e;
padding:16px;
margin:14px 0;
border-radius:14px;
}

.exercise{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.previous{
font-size:13px;
color:#9a9a9a;
margin-bottom:10px;
}

.pr{
color:#ffd700;
font-weight:bold;
margin-left:6px;
}

.bottomNav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#141414;
display:flex;
border-top:1px solid #222;
}

.bottomNav button{
flex:1;
background:none;
font-size:15px;
padding:16px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>Training Log</header>

<div class="container">

<!-- WORKOUT PAGE -->

<div id="workoutPage">

<select id="workoutSelect" onchange="loadWorkout()"></select>

<div id="exerciseList"></div>

</div>


<!-- LOG PAGE -->

<div id="logPage" class="hidden">

<div id="logList"></div>

</div>


<!-- CUSTOM PAGE -->

<div id="customPage" class="hidden">

<input id="customWorkoutName" placeholder="Workout Name">

<div id="customExerciseList"></div>

<button onclick="addCustomExercise()">Add Exercise</button>

<button onclick="saveCustomWorkout()">Save Workout</button>

</div>

</div>


<div class="bottomNav">
<button onclick="showPage('workoutPage')">Workout</button>
<button onclick="showPage('logPage')">Log</button>
<button onclick="showPage('customPage')">Custom</button>
</div>


<script>

/* STORAGE */

let sessions = JSON.parse(localStorage.getItem("training_sessions")||"[]")
let customWorkouts = JSON.parse(localStorage.getItem("custom_workouts")||"[]")


/* PRESETS */

let workouts = {

Push:["Bench Press","Incline Bench","Shoulder Press","Lateral Raise"],

Pull:["Deadlift","Barbell Row","Lat Pulldown","Bicep Curl"],

Legs:["Squat","Leg Press","Leg Curl","Calf Raise"]

}


/* INIT */

function init(){

let select=document.getElementById("workoutSelect")

select.innerHTML=""

Object.keys(workouts).forEach(w=>{
select.innerHTML+=`<option>${w}</option>`
})

customWorkouts.forEach(w=>{
select.innerHTML+=`<option>${w.name}</option>`
})

}

init()


/* NAVIGATION */

function showPage(page){

["workoutPage","logPage","customPage"].forEach(p=>{
document.getElementById(p).classList.add("hidden")
})

document.getElementById(page).classList.remove("hidden")

if(page==="logPage") renderLog()

}


/* LOAD WORKOUT */

function loadWorkout(){

let workout=document.getElementById("workoutSelect").value

let exercises=workouts[workout]

customWorkouts.forEach(w=>{
if(w.name===workout)exercises=w.exercises
})

let container=document.getElementById("exerciseList")

container.innerHTML=""

if(!exercises)return

exercises.forEach(e=>createExercise(e))

}


/* CREATE EXERCISE CARD */

function createExercise(name){

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<div class="exercise">${name}</div>

<div class="previous">${previousBest(name)}</div>

<input class="weight" placeholder="Weight">

<input class="reps" placeholder="Reps">

<button onclick="logSet(this,'${name}')">Add Set</button>

`

document.getElementById("exerciseList").appendChild(div)

}


/* PREVIOUS BEST */

function previousBest(ex){

let best=0

sessions.forEach(s=>{
if(s.exercise===ex && s.weight>best)best=s.weight
})

if(best===0)return "No previous record"

return "Previous Best: "+best+"kg"

}


/* LOG SET */

function logSet(btn,exercise){

let card=btn.parentElement

let weight=parseFloat(card.querySelector(".weight").value)
let reps=parseInt(card.querySelector(".reps").value)

if(!weight || !reps)return

let record={
exercise,
weight,
reps,
date:Date.now()
}

sessions.push(record)

localStorage.setItem("training_sessions",JSON.stringify(sessions))

card.querySelector(".weight").value=""
card.querySelector(".reps").value=""

renderLog()

}


/* PR CHECK */

function isPR(ex,w){

let best=0

sessions.forEach(s=>{
if(s.exercise===ex && s.weight>best)best=s.weight
})

return w>=best

}


/* RENDER LOG */

function renderLog(){

let container=document.getElementById("logList")

container.innerHTML=""

let sorted=[...sessions].sort((a,b)=>b.date-a.date)

sorted.forEach(s=>{

let pr=isPR(s.exercise,s.weight)

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<div class="exercise">${s.exercise}</div>

${s.weight}kg x ${s.reps}

${pr?'<span class="pr">🏆 PR</span>':""}

<br>

${new Date(s.date).toLocaleDateString()}

`

container.appendChild(div)

})

}


/* CUSTOM */

function addCustomExercise(){

let input=document.createElement("input")

input.placeholder="Exercise"

document.getElementById("customExerciseList").appendChild(input)

}

function saveCustomWorkout(){

let name=document.getElementById("customWorkoutName").value

let inputs=document.querySelectorAll("#customExerciseList input")

let exercises=[]

inputs.forEach(i=>{
if(i.value)exercises.push(i.value)
})

if(!name || exercises.length===0)return

customWorkouts.push({name,exercises})

localStorage.setItem("custom_workouts",JSON.stringify(customWorkouts))

alert("Saved")

init()

}

</script>

</body>
</html>
