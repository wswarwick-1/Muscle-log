<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Training Log</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:18px;
}

h1{
text-align:center;
color:#D4AF37;
}

button{
width:100%;
padding:14px;
margin:6px 0;
background:#D4AF37;
border:none;
border-radius:10px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:none;
}

.card{
background:#111;
padding:14px;
margin:10px 0;
border-radius:12px;
border:1px solid #D4AF37;
}

.exercise{
font-weight:bold;
color:#FFD700;
margin-top:8px;
}

.pr{
color:#FFD700;
font-weight:bold;
}

.small{
font-size:13px;
color:#D4AF37;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<h1>Training Log</h1>

<button onclick="showPage('workoutPage')">Workout</button>
<button onclick="showPage('logPage')">Log</button>
<button onclick="showPage('customPage')">Custom</button>

<div id="workoutPage">

<select id="workoutSelect"></select>

<select id="exerciseSelect"></select>

<div id="previousBest" class="small"></div>

<input id="weight" placeholder="Weight">
<input id="reps" placeholder="Reps">

<button onclick="addSet()">Add Set</button>

<div id="setList"></div>

<button onclick="finishWorkout()">Finish Workout</button>

</div>

<div id="logPage" class="hidden">

<h2 style="color:#D4AF37">Workout Log</h2>

<div id="log"></div>

</div>

<div id="customPage" class="hidden">

<h2 style="color:#D4AF37">Custom Workout</h2>

<input id="customWorkoutName" placeholder="Workout name">

<input id="customExercise" placeholder="Exercise">

<button onclick="addCustomExercise()">Add Exercise</button>

<div id="customExercises"></div>

<button onclick="saveCustomWorkout()">Save Workout</button>

</div>

<script>

/* -------- RECOVER LOG -------- */

function loadRecoveredSessions(){

let keys=["sessions","workoutSessions","trainingSessions","logSessions"]

let recovered=[]

keys.forEach(k=>{

let data=localStorage.getItem(k)

if(data){
try{
let parsed=JSON.parse(data)
if(Array.isArray(parsed)) recovered=recovered.concat(parsed)
}catch{}
}

})

return recovered
}

let sessions=loadRecoveredSessions()

let prs=JSON.parse(localStorage.getItem("prs"))||{}

let workouts=JSON.parse(localStorage.getItem("workouts"))||{

Push:["Bench Press","Overhead Press","Incline DB Press","Lateral Raise"],

Pull:["Deadlift","Pull Up","Barbell Row","Face Pull"],

Legs:["Squat","Leg Press","Romanian Deadlift","Leg Curl"]

}

let currentSets=[]

let customExercises=[]

/* SAVE */

function save(){

localStorage.setItem("sessions",JSON.stringify(sessions))
localStorage.setItem("prs",JSON.stringify(prs))
localStorage.setItem("workouts",JSON.stringify(workouts))

}

/* NAV */

function showPage(page){

document.getElementById("workoutPage").classList.add("hidden")
document.getElementById("logPage").classList.add("hidden")
document.getElementById("customPage").classList.add("hidden")

document.getElementById(page).classList.remove("hidden")

if(page==="logPage") renderLog()

}

/* WORKOUT LOAD */

function loadWorkouts(){

let w=document.getElementById("workoutSelect")

w.innerHTML=""

Object.keys(workouts).forEach(name=>{

let o=document.createElement("option")
o.value=name
o.textContent=name
w.appendChild(o)

})

loadExercises()

}

function loadExercises(){

let workout=document.getElementById("workoutSelect").value

let ex=document.getElementById("exerciseSelect")

ex.innerHTML=""

workouts[workout].forEach(e=>{

let o=document.createElement("option")
o.value=e
o.textContent=e
ex.appendChild(o)

})

showPreviousBest()

}

document.getElementById("workoutSelect").onchange=loadExercises
document.getElementById("exerciseSelect").onchange=showPreviousBest

/* PREVIOUS BEST */

function showPreviousBest(){

let ex=document.getElementById("exerciseSelect").value

let box=document.getElementById("previousBest")

if(prs[ex]){
box.innerHTML="Previous Best: "+prs[ex].weight+"kg x "+prs[ex].reps
}else{
box.innerHTML="Previous Best: none"
}

}

/* ADD SET */

function addSet(){

let ex=document.getElementById("exerciseSelect").value
let w=Number(document.getElementById("weight").value)
let r=Number(document.getElementById("reps").value)

if(!w||!r) return

currentSets.push({exercise:ex,weight:w,reps:r})

document.getElementById("weight").value=""
document.getElementById("reps").value=""

renderSets()

}

/* SHOW SETS */

function renderSets(){

let box=document.getElementById("setList")

box.innerHTML=""

currentSets.forEach((s,i)=>{

box.innerHTML+=`

<div class="card">

Set ${i+1}<br>
${s.exercise}<br>
${s.weight}kg x ${s.reps}

</div>

`

})

}

/* PR */

function checkPR(ex,w,r){

if(!prs[ex]||w>prs[ex].weight){

prs[ex]={weight:w,reps:r}
return true

}

return false

}

/* FINISH */

function finishWorkout(){

if(currentSets.length===0) return

let workout=document.getElementById("workoutSelect").value

let session={

date:new Date().toLocaleDateString(),
workout:workout,
sets:[...currentSets]

}

sessions.unshift(session)

currentSets.forEach(s=>{
checkPR(s.exercise,s.weight,s.reps)
})

currentSets=[]

save()

renderSets()

alert("Workout saved")

}

/* LOG */

function renderLog(){

let log=document.getElementById("log")

log.innerHTML=""

sessions.forEach(s=>{

let grouped={}

let volume=0

s.sets.forEach(set=>{

if(!grouped[set.exercise]) grouped[set.exercise]=[]

grouped[set.exercise].push(set)

})

let html=`

<div class="card">

<b>${s.workout}</b><br>
<span class="small">${s.date}</span><br><br>

`

Object.keys(grouped).forEach(ex=>{

html+=`<div class="exercise">${ex}</div>`

grouped[ex].forEach(set=>{

volume+=set.weight*set.reps

let pr=prs[ex] && prs[ex].weight===set.weight

html+=`
${set.weight}kg x ${set.reps}
${pr?"<span class='pr'> PR</span>":""}
<br>
`

})

html+="<br>"

})

html+=`<div class="small">Volume: ${volume}kg</div>`

html+="</div>"

log.innerHTML+=html

})

}

/* CUSTOM WORKOUT */

function addCustomExercise(){

let ex=document.getElementById("customExercise").value

if(!ex) return

customExercises.push(ex)

document.getElementById("customExercise").value=""

renderCustomExercises()

}

function renderCustomExercises(){

let box=document.getElementById("customExercises")

box.innerHTML=""

customExercises.forEach(e=>{

box.innerHTML+=`<div class="card">${e}</div>`

})

}

function saveCustomWorkout(){

let name=document.getElementById("customWorkoutName").value

if(!name||customExercises.length===0) return

workouts[name]=[...customExercises]

customExercises=[]

document.getElementById("customExercises").innerHTML=""

save()

loadWorkouts()

alert("Workout saved")

}

/* START */

loadWorkouts()

</script>

</body>
</html>
